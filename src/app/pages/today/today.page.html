<ion-header>
  <ion-toolbar>
    <ion-title>Today</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-item>
    <ion-input
      [(ngModel)]="newTaskTitle"
      placeholder="Add a new task..."
      (keyup.enter)="addTask()">
    </ion-input>
    <ion-button (click)="addTask()" fill="clear" slot="end">
      <ion-icon name="add-outline"></ion-icon>
    </ion-button>
  </ion-item>

  <p *ngIf="tasks.length === 0" class="ion-text-center ion-padding">
    No tasks yet. Add one above to get started.
  </p>

  <ion-list>
    <ion-item-sliding *ngFor="let task of tasks">
      <ion-item>
        <ion-checkbox
          slot="start"
          [checked]="task.completed"
          (ionChange)="toggleTask(task.id)">
        </ion-checkbox>
        <ion-label [class.completed]="task.completed">
          {{ task.title }}
        </ion-label>
      </ion-item>
      <ion-item-options side="end">
        <ion-item-option color="danger" (click)="deleteTask(task.id)">
          <ion-icon name="trash-outline"></ion-icon>
        </ion-item-option>
      </ion-item-options>
    </ion-item-sliding>
  </ion-list>
</ion-content>
